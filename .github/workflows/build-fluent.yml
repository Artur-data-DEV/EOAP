name: EOAP - Fluent SDK Build & Validate

on:
  push:
    branches: [main, 'feature/*', 'release/*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Fluent artifacts
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-and-generated
          path: |
            dist/
            src/fluent/generated/
          retention-days: 7

  validate-template:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Validate mandatory structure
        run: |
          echo "Checking mandatory directories for EOAP Template..."
          test -d src/fluent/core || (echo "Missing src/fluent/core" && exit 1)
          test -d src/fluent/access || (echo "Missing src/fluent/access" && exit 1)
          test -d src/fluent/governance || (echo "Missing src/fluent/governance" && exit 1)
          test -d src/fluent/integrations || (echo "Missing src/fluent/integrations" && exit 1)
          test -d src/fluent/automation || (echo "Missing src/fluent/automation" && exit 1)
          test -d src/metadata || (echo "Missing src/metadata" && exit 1)
          test -d prompts || (echo "Missing prompts/" && exit 1)
          test -d agents || (echo "Missing agents/" && exit 1)
          test -d templates || (echo "Missing templates/" && exit 1)
          test -d .github/workflows || (echo "Missing .github/workflows" && exit 1)
          echo "Mandatory structure validated successfully."
